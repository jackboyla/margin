name: PDF accessibility session
on: push
permissions:
  contents: read
jobs:
  session:
    if: github.ref == 'refs/heads/test/pdf-viewport-runner'
    runs-on: macos-26-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: swift test --filter PDFHighlightDocumentTests
      - name: Fetch the public paper
        run: |
          for endpoint in arxiv.org export.arxiv.org; do
            curl --fail --location --retry 2 --connect-timeout 8 --max-time 45 "https://$endpoint/pdf/2506.01844" -o "$RUNNER_TEMP/smolvla.pdf" && break
          done
          test "$(head -c 4 "$RUNNER_TEMP/smolvla.pdf")" = '%PDF'
          shasum -a 256 "$RUNNER_TEMP/smolvla.pdf"
      - name: Exercise public Chrome and native accessibility
        timeout-minutes: 5
        run: node scripts/hosted-pdf-session.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chrome-pdf-evidence
          path: ${{ runner.temp }}/margin-evidence
          if-no-files-found: ignore
