name: PDF accessibility session
on: push
permissions:
  contents: read
jobs:
  session:
    if: github.ref == 'refs/heads/test/pdf-viewport-runner'
    runs-on: macos-26-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: swift test --filter PDFHighlightDocumentTests
      - run: node scripts/hosted-pdf-session.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chrome-pdf-evidence
          path: ${{ runner.temp }}/margin-evidence
          if-no-files-found: ignore
