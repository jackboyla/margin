name: Check
on:
  push:
    branches-ignore: [test/pdf-viewport-runner]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  macos:
    runs-on: macos-26-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Show build toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - run: swift test
      - run: bash scripts/build-app.sh
      - run: bash scripts/package-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Margin-macOS
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
