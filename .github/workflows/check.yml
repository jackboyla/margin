name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Show build toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - run: swift test
      - run: bash scripts/build-app.sh
      - run: bash scripts/package-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Margin-macOS
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
